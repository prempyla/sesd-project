<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SETS — Smart Escalation Ticket System</title>
  <meta name="description" content="Enterprise-grade ticketing system with automated SLA enforcement and smart escalation. Login to manage your support tickets." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-icon">SETS</div>
        <h1>Escalation Desk</h1>
        <p>Smart Escalation Ticket System</p>
      </div>

      <!-- Quick Login Buttons -->
      <p style="font-family:var(--font-mono);font-size:10px;color:var(--ink-3);margin-bottom:8px;text-align:center;text-transform:uppercase;letter-spacing:0.5px;">Quick login as</p>
      <div class="quick-login">
        <button class="quick-btn" onclick="quickLogin('admin@sets.local','admin123')">Admin</button>
        <button class="quick-btn" onclick="quickLogin('agent@sets.local','agent123')">Agent</button>
        <button class="quick-btn" onclick="quickLogin('user@sets.local','user123')">User</button>
      </div>

      <div class="divider">or enter manually</div>

      <!-- Error message -->
      <div id="error-msg" class="error-msg"></div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;" id="login-btn">
          Sign In
        </button>
      </form>

      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);">
        <p style="font-family:var(--font-mono);font-size:10px;color:var(--ink-3);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px;">Demo credentials</p>
        <div style="display:grid;gap:4px;font-size:12px;color:var(--ink-2);">
          <div><strong style="color:var(--ink)">Admin</strong> · admin@sets.local / admin123</div>
          <div><strong style="color:var(--ink)">Agent</strong> · agent@sets.local / agent123</div>
          <div><strong style="color:var(--ink)">User</strong> · user@sets.local / user123</div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) {
      window.location.href = '/dashboard.html';
    }

    function quickLogin(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      document.getElementById('login-form').dispatchEvent(new Event('submit'));
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('error-msg');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      errEl.classList.remove('show');
      btn.innerHTML = '<span class="spinner"></span> Signing in…';
      btn.disabled = true;

      try {
        const res = await post('/auth/login', { email, password });
        Auth.setToken(res.data.token);
        Auth.setUser(res.data.user);
        window.location.href = '/dashboard.html';
      } catch (err) {
        errEl.textContent = err.message || 'Login failed. Check your credentials.';
        errEl.classList.add('show');
        btn.innerHTML = 'Sign In';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
